<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로또번호 추첨기 · 최종안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#1B64DA;
  --accent-soft:#E8F0FD;
  --accent-ink:#164FAD;
  --drum-accent:#FBBF24;
  --bg:#F2F4F6;
  --surface:#FFFFFF;
  --ink:#191F28;
  --ink-2:#333D4B;
  --ink-3:#4E5968;
  --line:#F2F4F6;
  --wait:#E5E8EB;
  --night:#0B1220;
  --night-2:#111B2E;
  --night-line:#22304A;
  --b1:#FBC400;--b2:#69C8F2;--b3:#FF7272;--b4:#B0B8C1;--b5:#B0D840;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{position:relative;max-width:430px;min-height:100%;margin:0 auto;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));overflow:hidden;background:var(--bg)}

/* header */
.head{padding:32px 20px 0;display:flex;flex-direction:column;gap:8px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.head-row{display:flex;align-items:center;gap:8px}
.round{margin:0;font-size:15px;font-weight:500;color:var(--ink-3)}
.chip{margin-left:auto;font-size:13px;font-weight:700;color:var(--accent);background:var(--surface);border-radius:999px;padding:5px 10px}
h1{margin:0;font-size:26px;line-height:1.38;font-weight:800;letter-spacing:-.5px}

/* card */
.card{position:relative;margin:24px 20px 0;background:var(--surface);border-radius:24px;padding:28px 20px 20px;display:flex;flex-direction:column;gap:22px;align-items:center}
.card.ring{animation:ring .9s ease-out both}
.card-label{margin:0;height:20px;font-size:14px;font-weight:700;color:var(--accent)}
.balls{position:relative;display:flex;gap:9px;height:48px;align-items:center}
.ball{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--ink);
  box-shadow:inset -3px -5px 8px rgba(0,0,0,.14),0 4px 10px rgba(25,31,40,.10)}
.ball.wait{background:var(--wait)!important;box-shadow:inset 0 2px 4px rgba(0,0,0,.06);animation:waiting 1.2s ease-in-out infinite}
.ball.land{animation:land .55s cubic-bezier(.34,1.56,.64,1) both}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.burst span{position:absolute;left:0;top:0;opacity:0;animation:conf 1s cubic-bezier(.15,.7,.3,1) both}
.actions{display:flex;gap:8px;width:100%}
.btn{flex:1;height:48px;border:0;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .16s cubic-bezier(.3,.7,.4,1),background .25s,color .25s}
.btn:active{transform:scale(.965)}
.btn:disabled{cursor:default}
.btn-gray{background:var(--bg);color:var(--ink-2)}
.btn-soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn-soft.done{background:var(--bg);color:var(--ink-3)}

/* saved */
.saved{margin:28px 20px 0;display:flex;flex-direction:column;gap:12px;animation:rise .6s .15s cubic-bezier(.2,.8,.2,1) both}
.saved-head{display:flex;justify-content:space-between;align-items:baseline}
h2{margin:0;font-size:18px;font-weight:700}
.count{font-size:14px;color:var(--ink-3)}
.list{background:var(--surface);border-radius:20px;padding:4px 16px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;height:58px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.new{animation:rowIn .5s cubic-bezier(.2,.8,.2,1) both}
.row-label{width:16px;font-size:14px;font-weight:700;color:var(--ink-3)}
.row-balls{display:flex;gap:6px}
.mini{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink);box-shadow:inset -2px -3px 5px rgba(0,0,0,.12)}
.empty{margin:0;padding:20px 0;text-align:center;font-size:14px;color:var(--ink-3)}
.note{margin:0;font-size:13px;color:var(--ink-3)}

/* CTA */
.cta-wrap{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;padding:12px 20px calc(28px + env(safe-area-inset-bottom,0px));background:var(--bg);z-index:5;display:flex;gap:8px}
.cta-2{flex:1;height:56px;border:0;border-radius:16px;background:var(--surface);color:var(--accent-ink);font-size:16px;font-weight:700;cursor:pointer;transition:transform .16s cubic-bezier(.3,.7,.4,1)}
.cta-2:active{transform:scale(.965)}
.cta-2:disabled{cursor:default;opacity:.6}
.cta{flex:2;position:relative;overflow:hidden;height:56px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform .16s cubic-bezier(.3,.7,.4,1),opacity .2s}
.cta:active{transform:scale(.965)}
.cta:disabled{cursor:default;opacity:.85}
.cta .sheen{position:absolute;top:0;bottom:0;left:0;width:28%;background:rgba(255,255,255,.22);animation:sheen 3.2s 1s ease-in-out infinite;pointer-events:none}
.cta .label{position:relative}

/* toast */
.toast{z-index:20;position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:12px 18px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:toast 1.8s cubic-bezier(.2,.8,.2,1) both}

/* drum overlay */
.overlay{position:fixed;inset:0;z-index:10;background:rgba(11,18,32,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:36px;animation:ovIn .22s ease-out both}
.overlay.open{display:flex}
.overlay.closing{animation:ovOut .26s ease-in both}
.overlay.closing .drum-wrap{animation:drumOut .26s ease-in both}
.skip{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:12px;height:44px;padding:0 12px;border:0;background:transparent;color:#CBD5E1;font-size:14px;font-weight:600;cursor:pointer}
.drum-wrap{position:relative;width:260px;height:280px;animation:drumIn .45s cubic-bezier(.34,1.4,.64,1) both}
.drum-glow{position:absolute;left:50%;bottom:-4px;width:210px;height:32px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at center,color-mix(in srgb,var(--drum-accent) 40%,transparent) 0,transparent 70%);animation:glowPulse 1s ease-in-out infinite}
.drum{position:absolute;left:0;top:0;width:260px;height:260px;border-radius:50%;background:var(--night-2);border:2px solid var(--night-line);overflow:hidden}
.drum-ring{position:absolute;inset:10px;border-radius:50%;border:1.5px dashed #2C3D5C;animation:spin 1.1s linear infinite}
.drum-ball{position:absolute;width:30px;height:30px;border-radius:50%;box-shadow:inset -2px -3px 5px rgba(0,0,0,.25);animation:tumble .4s linear infinite}
.drum-shine{position:absolute;left:30px;top:20px;width:100px;height:56px;border-radius:50%;background:rgba(255,255,255,.05);transform:rotate(-28deg)}
.drum-text{display:flex;flex-direction:column;align-items:center;gap:14px}
.drum-text p{margin:0;font-size:18px;font-weight:700;color:#F1F5F9;display:flex;align-items:center;gap:6px}
.dots{display:inline-flex;gap:3px}
.dots i{width:4px;height:4px;border-radius:50%;background:#F1F5F9;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.bar{width:160px;height:4px;border-radius:2px;background:var(--night-line);overflow:hidden}
.bar i{display:block;width:100%;height:100%;background:var(--drum-accent);transform-origin:left;transform:scaleX(0)}
.overlay.open .bar i{animation:fill var(--drum-ms,1400ms) linear both}

/* 5게임 결과 시트 */
.backdrop{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.4);display:none;animation:ovIn .25s ease-out both}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;z-index:9;display:none;background:var(--surface);border-radius:24px 24px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:sheetUp .38s cubic-bezier(.2,.9,.25,1) both}
.backdrop.open,.sheet.open{display:block}
.backdrop.closing{animation:ovOut .24s ease-in both}
.sheet.closing{animation:sheetDown .24s ease-in both}
.handle{width:36px;height:4px;border-radius:2px;background:var(--wait);margin:0 auto 14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-head h2{font-size:20px;font-weight:800}
.close{height:44px;padding:0 4px;border:0;background:transparent;color:var(--ink-3);font-size:15px;font-weight:600;cursor:pointer}
.sheet-sub{margin:0 0 8px;font-size:14px;color:var(--ink-3)}
.five .row{height:56px}
.five .mini{width:36px;height:36px;font-size:14px;font-weight:800}
.mini.flip{animation:flip .55s cubic-bezier(.3,1.3,.5,1) both}
.five .row-label{color:var(--accent)}
.sheet .actions{margin-top:16px}
.sheet .btn{height:52px;border-radius:16px;font-size:16px}
.btn-main{background:var(--accent);color:#fff}
.btn-main.done{background:var(--bg);color:var(--ink-3)}

/* keyframes */
@keyframes sheetUp{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes sheetDown{from{transform:translate(-50%,0)}to{transform:translate(-50%,100%)}}
@keyframes flip{0%{transform:perspective(200px) rotateY(95deg) scale(.6);opacity:0}60%{transform:perspective(200px) rotateY(-12deg) scale(1.08);opacity:1}100%{transform:none;opacity:1}}
@keyframes land{0%{transform:translateY(-34px) scale(.35);opacity:0}55%{transform:translateY(3px) scale(1.14);opacity:1}75%{transform:translateY(0) scale(.95)}100%{transform:none;opacity:1}}
@keyframes waiting{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1);opacity:1}}
@keyframes conf{0%{transform:translate(-50%,-50%) rotate(0) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) scale(.5);opacity:0}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 38%,transparent)}100%{box-shadow:0 0 0 22px color-mix(in srgb,var(--accent) 0%,transparent)}}
@keyframes rowIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,14px) scale(.96)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,6px)}}
@keyframes sheen{0%{transform:translateX(-140%) skewX(-22deg)}55%,100%{transform:translateX(420%) skewX(-22deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@keyframes ovOut{from{opacity:1}to{opacity:0}}
@keyframes drumIn{0%{transform:scale(.7) translateY(30px);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:none;opacity:1}}
@keyframes drumOut{to{transform:scale(1.15);opacity:0}}
@keyframes tumble{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(var(--tx),calc(var(--ty) * -1)) rotate(90deg)}50%{transform:translate(calc(var(--tx) * -.6),calc(var(--ty) * -1.6)) rotate(180deg)}75%{transform:translate(calc(var(--tx) * -1),calc(var(--ty) * -.5)) rotate(270deg)}100%{transform:translate(0,0) rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glowPulse{0%,100%{opacity:.4}50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="head-row">
      <p class="round" id="round">[회차]회 추첨 · [추첨일]</p>
      <span class="chip" id="chip">오늘 0번 뽑았어요</span>
    </div>
    <h1>이번 주 행운 번호를<br>뽑아볼까요?</h1>
  </header>

  <section class="card" id="card" aria-live="polite">
    <p class="card-label" id="cardLabel">오늘의 추천 번호</p>
    <div class="balls" id="balls"></div>
    <div class="actions">
      <button type="button" class="btn btn-gray" id="copyBtn">번호 복사</button>
      <button type="button" class="btn btn-soft" id="saveBtn">저장하기</button>
    </div>
  </section>

  <section class="saved">
    <div class="saved-head">
      <h2>저장한 번호</h2>
      <span class="count" id="savedCount">0개</span>
    </div>
    <div class="list" id="savedList"></div>
    <p class="note">번호는 이 기기에만 저장돼요</p>
  </section>
</div>

<div class="cta-wrap">
  <button type="button" class="cta-2" id="fiveBtn">5게임 뽑기</button>
  <button type="button" class="cta" id="drawBtn"><span class="sheen"></span><span class="label" id="ctaLabel">번호 뽑기</span></button>
</div>

<div class="overlay" id="overlay" role="dialog" aria-label="번호를 섞는 중">
  <button type="button" class="skip" id="skipBtn">건너뛰기</button>
  <div class="drum-wrap">
    <div class="drum-glow"></div>
    <div class="drum" id="drum"><div class="drum-ring"></div><div class="drum-shine"></div></div>
  </div>
  <div class="drum-text">
    <p>행운을 섞는 중 <span class="dots"><i></i><i></i><i></i></span></p>
    <div class="bar"><i></i></div>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="5게임 결과">
  <div class="handle"></div>
  <div class="sheet-head">
    <h2>5게임을 뽑았어요</h2>
    <button type="button" class="close" id="closeSheet">닫기</button>
  </div>
  <p class="sheet-sub">로또 한 장에 들어가는 5줄이에요</p>
  <div class="five" id="fiveList"></div>
  <div class="actions">
    <button type="button" class="btn btn-gray" id="copyAllBtn">전체 복사</button>
    <button type="button" class="btn btn-main" id="saveAllBtn">전체 저장</button>
  </div>
</div>

<script>
(function () {
  // ---- 설정 ----
  var DRUM_MS = 1400;          // 드럼 연출 길이
  var DRUM_MS_SHORT = 800;     // 같은 날 3번째 뽑기부터
  var LAND_START = 120, LAND_GAP = 130, LAND_END = 320;
  var MAX_SAVED = 50, SHOW_SAVED = 4;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 앱인토스 SDK의 햅틱 API로 교체하세요. type: 'tap' | 'tick' | 'success'
  function haptic(type) { /* e.g. SDK 햅틱 호출 */ }

  // 앱인토스에서는 SDK Storage로 교체 (setItem/getItem은 async)
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  var COLORS = ['var(--b1)', 'var(--b2)', 'var(--b3)', 'var(--b4)', 'var(--b5)'];
  function color(n) { return COLORS[Math.min(4, Math.floor((n - 1) / 10))]; }
  function gloss(n, a) { return 'radial-gradient(circle at 34% 28%, rgba(255,255,255,' + a + ') 0 12%, rgba(255,255,255,0) 44%), ' + color(n); }

  function pick() {
    var s = new Set(), buf = new Uint32Array(1);
    while (s.size < 6) { crypto.getRandomValues(buf); s.add(1 + (buf[0] % 45)); }
    return Array.from(s).sort(function (a, b) { return a - b; });
  }

  var today = new Date().toISOString().slice(0, 10);
  var daily = store.get('lotto:v1:daily', { date: today, count: 0 });
  if (daily.date !== today) daily = { date: today, count: 0 };

  var state = {
    cur: pick(),
    saved: store.get('lotto:v1:saved', []),
    phase: 'idle',
    final: null,
    justSaved: false,
    gen: 0,
    mode: 'single',
    five: [],
    fiveSaved: false
  };

  var $ = function (id) { return document.getElementById(id); };
  var ballsEl = $('balls'), cardEl = $('card'), overlay = $('overlay');
  var timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  // ---- 공 ----
  var balls = [];
  for (var i = 0; i < 6; i++) { var b = document.createElement('div'); b.className = 'ball'; ballsEl.appendChild(b); balls.push(b); }
  function setBall(i, n, animate, delay) {
    var el = balls[i];
    el.classList.remove('wait', 'land');
    if (n == null) { el.textContent = ''; el.style.background = ''; el.style.animationDelay = (i * 0.1) + 's'; el.classList.add('wait'); return; }
    el.textContent = n;
    el.style.background = gloss(n, .8);
    el.setAttribute('aria-label', n + '번');
    if (animate) { void el.offsetWidth; el.style.animationDelay = (delay || 0) + 's'; el.classList.add('land'); }
  }
  state.cur.forEach(function (n, i) { setBall(i, n, true, 0.25 + i * 0.08); });

  // ---- 드럼 공 ----
  var pos = [[42,160],[72,182],[104,196],[136,198],[168,190],[198,172],[56,130],[88,150],[120,164],[152,160],[184,142],[102,122],[134,130],[166,112]];
  pos.forEach(function (p, i) {
    var d = document.createElement('div');
    d.className = 'drum-ball';
    d.style.left = p[0] + 'px'; d.style.top = p[1] + 'px';
    d.style.background = 'radial-gradient(circle at 34% 28%, rgba(255,255,255,.75) 0 12%, rgba(255,255,255,0) 44%), ' + COLORS[i % 5];
    d.style.setProperty('--tx', (18 + (i * 7 % 22)) + 'px');
    d.style.setProperty('--ty', (40 + (i * 11 % 50)) + 'px');
    d.style.animationDuration = (0.36 + (i % 4) * 0.07) + 's';
    d.style.animationDelay = (-(i * 0.05)) + 's';
    $('drum').appendChild(d);
  });

  // ---- UI 갱신 ----
  function busy() { return state.phase !== 'idle'; }
  function syncUI() {
    var b = busy();
    $('drawBtn').disabled = b;
    $('fiveBtn').disabled = b;
    $('copyBtn').disabled = b;
    $('saveBtn').disabled = b || state.justSaved;
    $('saveBtn').textContent = state.justSaved ? '저장됨' : '저장하기';
    $('saveBtn').classList.toggle('done', state.justSaved);
    $('ctaLabel').textContent = b ? '뽑는 중…' : (state.gen === 0 ? '번호 뽑기' : '다시 뽑기');
    $('cardLabel').textContent = state.phase === 'land' ? '번호가 나오고 있어요' : (b ? '잠시만요' : (state.gen === 0 ? '오늘의 추천 번호' : '방금 뽑은 번호'));
    $('chip').textContent = '오늘 ' + daily.count + '번 뽑았어요';
  }

  function renderSaved(animateFirst) {
    var list = $('savedList');
    list.innerHTML = '';
    $('savedCount').textContent = state.saved.length + '개';
    if (!state.saved.length) { list.innerHTML = '<p class="empty">아직 저장한 번호가 없어요</p>'; return; }
    state.saved.slice(0, SHOW_SAVED).forEach(function (item, idx) {
      var row = document.createElement('div');
      row.className = 'row' + (animateFirst && idx === 0 ? ' new' : '');
      row.innerHTML = '<span class="row-label">' + 'ABCD'[idx] + '</span><div class="row-balls">' +
        item.numbers.map(function (n) { return '<div class="mini" style="background:' + gloss(n, .75) + '">' + n + '</div>'; }).join('') + '</div>';
      list.appendChild(row);
    });
  }

  function toast(text) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 1800);
  }

  function celebrate() {
    cardEl.classList.remove('ring'); void cardEl.offsetWidth; cardEl.classList.add('ring');
    var burst = document.createElement('div'); burst.className = 'burst';
    var cols = ['var(--b1)', 'var(--b2)', 'var(--b3)', 'var(--b5)', 'var(--accent)', 'var(--b4)'];
    for (var k = 0; k < 22; k++) {
      var ang = (k / 22) * Math.PI * 2 + (k % 3) * 0.17, dist = 80 + (k * 37 % 70), round = k % 3 === 0;
      var s = document.createElement('span');
      s.style.width = (round ? 7 : 5) + 'px'; s.style.height = (round ? 7 : 11) + 'px';
      s.style.borderRadius = round ? '50%' : '2px';
      s.style.background = cols[k % cols.length];
      s.style.setProperty('--dx', Math.round(Math.cos(ang) * dist * 1.5) + 'px');
      s.style.setProperty('--dy', Math.round(Math.sin(ang) * dist * 0.9 + 30) + 'px');
      s.style.setProperty('--r', ((k % 2 ? 1 : -1) * (180 + k * 23)) + 'deg');
      s.style.animationDuration = (0.9 + (k % 4) * 0.12) + 's';
      burst.appendChild(s);
    }
    ballsEl.appendChild(burst);
    setTimeout(function () { burst.remove(); }, 1600);
  }

  // ---- 흐름 ----
  function start(mode) {
    if (busy()) return;
    clearTimers();
    haptic('tap');
    daily.count += 1; store.set('lotto:v1:daily', daily);
    state.mode = mode;
    if (mode === 'single') {
      state.final = pick();   // 누르는 순간 확정
      state.gen += 1; state.justSaved = false;
      for (var i = 0; i < 6; i++) setBall(i, null);
    } else {
      state.five = [pick(), pick(), pick(), pick(), pick()];
      state.fiveSaved = false;
    }
    var next = mode === 'single' ? land : showFive;
    if (reduceMotion) { next(); return; }
    var ms = daily.count >= 3 ? DRUM_MS_SHORT : DRUM_MS;
    state.phase = 'drum'; syncUI();
    overlay.style.setProperty('--drum-ms', ms + 'ms');
    overlay.classList.remove('closing'); overlay.classList.add('open');
    later(closeOverlay, ms);
    later(next, ms + 260);
  }
  function closeOverlay() {
    if (!overlay.classList.contains('open')) return;
    overlay.classList.add('closing');
    setTimeout(function () { overlay.classList.remove('open', 'closing'); }, 260);
  }
  function land() {
    clearTimers();
    state.phase = 'land'; syncUI();
    state.final.forEach(function (n, i) {
      later(function () { setBall(i, n, true); haptic('tick'); }, LAND_START + i * LAND_GAP);
    });
    later(function () {
      state.cur = state.final; state.phase = 'idle'; syncUI();
      celebrate(); haptic('success');
    }, LAND_START + 5 * LAND_GAP + LAND_END);
  }
  function skip() {
    if (state.phase !== 'drum') return;
    closeOverlay();
    (state.mode === 'single' ? land : showFive)();
  }

  // ---- 5게임 시트 ----
  var SHEET_IN = 0.15, ROW_GAP = 0.09, BALL_GAP = 0.05;
  function showFive() {
    clearTimers();
    state.phase = 'five'; syncUI();
    var list = $('fiveList');
    list.innerHTML = '';
    state.five.forEach(function (nums, r) {
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span class="row-label">' + 'ABCDE'[r] + '</span><div class="row-balls">' +
        nums.map(function (n, j) {
          return '<div class="mini flip" style="background:' + gloss(n, .75) + ';animation-delay:' + (SHEET_IN + r * ROW_GAP + j * BALL_GAP).toFixed(2) + 's">' + n + '</div>';
        }).join('') + '</div>';
      list.appendChild(row);
      later(function () { haptic('tick'); }, (SHEET_IN + r * ROW_GAP + 0.3) * 1000);
    });
    later(function () { haptic('success'); }, (SHEET_IN + 4 * ROW_GAP + 5 * BALL_GAP + 0.55) * 1000);
    $('saveAllBtn').textContent = '전체 저장';
    $('saveAllBtn').classList.remove('done');
    $('saveAllBtn').disabled = false;
    $('backdrop').classList.remove('closing'); $('sheet').classList.remove('closing');
    $('backdrop').classList.add('open'); $('sheet').classList.add('open');
  }
  function closeSheet() {
    if (state.phase !== 'five') return;
    clearTimers();
    $('backdrop').classList.add('closing'); $('sheet').classList.add('closing');
    setTimeout(function () {
      $('backdrop').classList.remove('open', 'closing'); $('sheet').classList.remove('open', 'closing');
      state.phase = 'idle'; syncUI();
    }, 240);
  }
  $('closeSheet').addEventListener('click', closeSheet);
  $('backdrop').addEventListener('click', closeSheet);
  $('copyAllBtn').addEventListener('click', function () {
    var text = state.five.map(function (nums, r) { return 'ABCDE'[r] + ' ' + nums.join(' '); }).join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {});
    toast('5게임을 복사했어요');
  });
  $('saveAllBtn').addEventListener('click', function () {
    if (state.fiveSaved) return;
    if (state.saved.length + 5 > MAX_SAVED) { toast('저장은 50개까지 할 수 있어요'); return; }
    var now = new Date().toISOString();
    state.five.slice().reverse().forEach(function (nums, k) {
      state.saved.unshift({ id: Date.now().toString(36) + k, numbers: nums.slice(), createdAt: now, source: 'five' });
    });
    store.set('lotto:v1:saved', state.saved);
    state.fiveSaved = true;
    $('saveAllBtn').textContent = '저장됨';
    $('saveAllBtn').classList.add('done');
    $('saveAllBtn').disabled = true;
    renderSaved(true);
    toast('5게임을 저장했어요');
  });

  $('drawBtn').addEventListener('click', function () { start('single'); });
  $('fiveBtn').addEventListener('click', function () { start('five'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  $('skipBtn').addEventListener('click', skip);
  $('copyBtn').addEventListener('click', function () {
    var text = state.cur.join(', ');
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {});
    toast(text + ' 복사했어요');
  });
  $('saveBtn').addEventListener('click', function () {
    if (busy() || state.justSaved) return;
    if (state.saved.length >= MAX_SAVED) { toast('저장은 50개까지 할 수 있어요'); return; }
    state.saved.unshift({ id: Date.now().toString(36), numbers: state.cur.slice(), createdAt: new Date().toISOString(), source: 'single' });
    store.set('lotto:v1:saved', state.saved);
    state.justSaved = true; syncUI(); renderSaved(true);
    toast('저장한 번호에 추가했어요');
  });

  syncUI();
  renderSaved(false);
})();
</script>
</body>
</html>
